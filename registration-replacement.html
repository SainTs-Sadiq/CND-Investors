<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — CND Investors</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script></head><body><div class="login"><div class="login-card"><a class="brand" href="index.html"><i>◈</i> CND<span>Investors</span></a><h1>Create your account</h1><p class="muted">KYC and suitability checks are required before investing.</p><div class="field"><label>Full name</label><input id="rname" autocomplete="name" maxlength="120"></div><div class="field"><label>Email</label><input id="remail" type="email" autocomplete="email" maxlength="254"></div><div class="field"><label>Password</label><input id="rpassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" oninput="validatePassword()"><small class="muted">At least 12 characters: uppercase, lowercase, number and special character.</small><div id="passwordChecklist" class="muted" style="margin-top:8px;line-height:1.7">✗ 12+ characters<br>✗ Uppercase<br>✗ Lowercase<br>✗ Number<br>✗ Special character</div></div><div class="field"><label>Confirm password</label><input id="rconfirm" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><button id="createBtn" class="btn primary" style="width:100%" onclick="register()">Create account</button><p id="registerMsg" class="muted"></p><p class="muted">Already have an account? <a href="client.html">Sign in</a></p></div></div><script>function passwordValid(p){return p.length>=12&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p)}function validatePassword(){const p=$('#rpassword').value,c=[p.length>=12,/[A-Z]/.test(p),/[a-z]/.test(p),/\d/.test(p),/[^A-Za-z0-9]/.test(p)],l=['12+ characters','Uppercase','Lowercase','Number','Special character'];$('#passwordChecklist').innerHTML=c.map((x,i)=>`${x?'✓':'✗'} ${l[i]}`).join('<br>')}async function register(){const n=$('#rname').value.trim(),e=$('#remail').value.trim().toLowerCase(),p=$('#rpassword').value,c=$('#rconfirm').value;if(n.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return $('#registerMsg').textContent='Enter a valid name and email.';if(!passwordValid(p))return $('#registerMsg').textContent='Password does not meet all requirements.';if(p!==c)return $('#registerMsg').textContent='Passwords do not match.';$('#createBtn').disabled=true;const {data,error}=await supabaseClient.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:`${location.origin}/client.html`}});$('#createBtn').disabled=false;if(error)return $('#registerMsg').textContent=error.message;$('#registerMsg').textContent=data.session?'Account created. Redirecting…':`Account created. Confirmation email sent to ${e}. Confirm it, then sign in.`;if(data.session)setTimeout(()=>location.replace('client.html'),700)}</script></body></html>
