<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investment Requests — CND Investors</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script></head><body><div class="topbar"><strong>INVESTMENT REQUESTS</strong> · Authorized operations/finance only.</div><div class="container" style="padding:28px"><div class="portal-head"><div><a class="brand" href="admin.html"><i>◈</i> CND<span>Investors</span></a><h1>Investment Requests</h1><p class="muted">Approve only after KYC, suitability, balance and plan eligibility are satisfied.</p></div><a class="btn outline" href="admin.html">Operations dashboard</a></div><div class="card" style="margin-top:24px"><div class="tablewrap"><table class="table"><thead><tr><th>Investor</th><th>Plan</th><th>Amount</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="requests"></tbody></table></div></div></div><script>async function guard(){const p=await profile();if(!p||!['operations','finance','admin','super_admin'].includes(p.role))location.replace('client.html')}async function load(){const {data,error}=await supabaseClient.from('investment_requests').select('*,profiles:investor_id(full_name,email),investment_plans(name)').order('created_at',{ascending:false});if(error)return alert(error.message);$('#requests').innerHTML=(data||[]).map(x=>`<tr><td>${esc(x.profiles?.full_name||'Investor')}<small>${esc(x.profiles?.email||'')}</small></td><td>${esc(x.investment_plans?.name||'Plan')}</td><td>${money(x.amount)}</td><td><span class="status ${x.status==='approved'?'ok':x.status==='rejected'?'risk':'pending'}">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.status==='pending'?`<button class="btn primary" onclick="review('${x.id}','approve')">Approve & allocate</button> <button class="btn ghost" onclick="review('${x.id}','reject')">Reject</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No investment requests.</td></tr>'}async function review(id,decision){let notes=null;if(decision==='reject'){notes=prompt('Reason for rejection?');if(notes===null)return}else{if(!confirm('Confirm eligibility checks have been completed and approve this allocation?'))return}const strategy=decision==='approve'?(prompt('Manual strategy / desk allocation reference','manual_portfolio')||'manual_portfolio'):null;const ref=decision==='approve'?prompt('Execution reference/hash (optional)'):null;const {error}=await supabaseClient.rpc('admin_review_investment_request',{p_request_id:id,p_decision:decision,p_strategy:strategy,p_execution_reference:ref,p_notes:notes});if(error)return alert(error.message);load()}document.addEventListener('DOMContentLoaded',async()=>{await guard();load()})</script></body></html>
