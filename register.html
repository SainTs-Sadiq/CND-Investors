<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — CND Investors</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script></head><body><div class="login"><div class="login-card"><a class="brand" href="index.html"><i>◈</i> CND<span>Investors</span></a><span class="badge blue">Secure client registration</span><h1>Create your account</h1><p class="muted">Open your CND Investors client account. KYC and suitability checks are required before investing.</p><div class="field"><label>Full name</label><input id="rname" autocomplete="name"></div><div class="field"><label>Email</label><input id="remail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="rpassword" type="password" autocomplete="new-password"><small class="muted">Minimum 8 characters.</small></div><button class="btn primary" style="width:100%" onclick="register()">Create account</button><p id="registerMsg" class="muted"></p><p class="muted" style="margin-top:18px">Already have an account? <a href="client.html">Sign in</a></p><p class="muted"><a href="index.html">← Back to CND Investors</a></p></div></div><script>async function register(){const name=$('#rname').value.trim(),email=$('#remail').value.trim(),password=$('#rpassword').value;if(!name||!email||password.length<8)return $('#registerMsg').textContent='Enter your name, a valid email and a password of at least 8 characters.';const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return $('#registerMsg').textContent=error.message;$('#registerMsg').textContent=data.session?'Account created. Redirecting…':'Account created. Check your email to confirm your account, then sign in.';if(data.session)setTimeout(()=>location.replace('client.html'),700)}</script></body></htm
